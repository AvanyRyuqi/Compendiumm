name: Compendium Android

on:
  push:
    branches: [main]
    tags: ['compendium-v*']
    paths: ['compendium/android/**', 'compendium/source/core/**', 'compendium/source/android/**', 'compendium/source/third_party/**', 'compendium/VERSION', '.github/workflows/compendium-android.yml']
  pull_request:
    paths: ['compendium/android/**', 'compendium/source/core/**', 'compendium/source/android/**', 'compendium/source/third_party/**', 'compendium/VERSION']
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the APK to a release when a compendium-v* tag is pushed

jobs:
  apk:
    name: Compendium (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK pieces
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: with the four secrets set, the APK is signed with your own key. Without them it is signed
      # with a throwaway debug key, which is fine for trying it out.
      - name: Signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/compendium.keystore"
            echo "COMPENDIUM_KEYSTORE=$RUNNER_TEMP/compendium.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        working-directory: compendium/android
        env:
          COMPENDIUM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          COMPENDIUM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          COMPENDIUM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        shell: bash
        run: |
          mkdir -p dist
          cp compendium/android/app/build/outputs/apk/release/*.apk "dist/Compendium-$(head -n1 compendium/VERSION | tr -d '[:space:]')-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Compendium-android
          path: dist/*.apk

      # Pushing a tag such as compendium-v0.0.4 publishes the APK on the Releases page.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/compendium-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          prerelease: true
